<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ことわざクイズ</title>
<style>
:root{
  --bg:#f7f5f0;
  --card:#ffffff;
  --ink:#2d2a26;
  --sub:#6b6560;
  --accent:#3a6b5c;
  --accent-soft:#e7efec;
  --correct:#3a7d3a;
  --correct-bg:#e6f4e6;
  --wrong:#b3452e;
  --wrong-bg:#fbe9e5;
  --border:#e3ddd2;
  --mark:#fdf1c7;
}
*{box-sizing:border-box;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,system-ui,sans-serif;
  background:var(--bg);
  color:var(--ink);
  line-height:1.7;
  padding-bottom:60px;
  min-height:100vh;
}
header{text-align:center;padding:36px 16px 12px;}
header h1{margin:0 0 8px;font-size:1.6rem;}
header p{margin:0;color:var(--sub);font-size:0.95rem;}
.progress-wrap{
  position:sticky;top:0;z-index:10;
  background:rgba(247,245,240,0.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border);
  padding:12px 16px;
}
.progress-inner{
  max-width:720px;margin:0 auto;
  display:flex;align-items:center;gap:14px;
  font-size:0.85rem;color:var(--sub);
}
.progress-bar-track{flex:1;height:6px;background:var(--accent-soft);border-radius:999px;overflow:hidden;}
.progress-bar-fill{height:100%;background:var(--accent);border-radius:999px;transition:width .25s ease;}
.progress-inner strong{color:var(--accent);white-space:nowrap;}
main{max-width:720px;margin:0 auto;padding:24px 16px 0;}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 22px 20px;}
.q-body{display:flex;gap:18px;align-items:flex-start;}
.q-image-wrap{
  flex:0 0 220px;width:220px;height:150px;
  border-radius:12px;overflow:hidden;
  background:var(--accent-soft);border:1px solid var(--border);
}
.q-image{width:100%;height:100%;object-fit:cover;display:block;}
.q-image-fallback{width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:2.6rem;}
.q-content{flex:1;min-width:0;}
@media (max-width:480px){
  .q-body{flex-direction:column;}
  .q-image-wrap{width:100%;height:220px;}
}
.q-head{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.q-num{font-size:0.8rem;color:var(--sub);background:var(--accent-soft);border-radius:999px;padding:2px 10px;}
.q-term{font-size:1.35rem;font-weight:700;}
.q-reading{width:100%;}
.q-emoji{font-size:1.4rem;}
.q-sense{font-size:0.8rem;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 10px;}
.q-reading{font-size:0.85rem;color:var(--sub);}
.q-example{
  font-size:1rem;line-height:1.8;
  border-left:4px solid var(--accent);
  padding:6px 12px;margin:0 0 16px;
  background:#faf9f6;border-radius:0 8px 8px 0;
}
.q-example .ex-label{display:block;font-size:0.75rem;color:var(--sub);}
.q-example mark{background:var(--mark);color:inherit;font-weight:700;padding:0 2px;border-radius:3px;}
.q-example .blank{
  display:inline-block;min-width:4.5em;border-bottom:2px solid var(--accent);
  text-align:center;color:var(--accent);font-weight:700;margin:0 2px;
}
.q-meaning-prompt{
  font-size:1.05rem;line-height:1.8;
  background:var(--accent-soft);border-radius:10px;
  padding:14px 16px;margin:2px 0 12px;
}
.mode-switch{max-width:720px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;}
.set-switch .mode-btn.active{background:var(--ink);border-color:var(--ink);}
.mode-btn{
  flex:1;padding:10px 8px;border-radius:10px;
  border:1.5px solid var(--border);background:#fff;color:var(--sub);
  font-size:0.88rem;cursor:pointer;
  transition:background .15s, border-color .15s, color .15s;
}
.mode-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
.choices{display:flex;flex-direction:column;gap:10px;}
button.choice{
  text-align:left;padding:13px 14px;
  border:1.5px solid var(--border);border-radius:10px;
  background:#fff;font-size:1rem;color:var(--ink);
  cursor:pointer;transition:background .15s, border-color .15s;
  font-family:inherit;
}
button.choice:hover:not(:disabled){border-color:var(--accent);}
button.choice .label{font-weight:700;margin-right:8px;color:var(--accent);}
button.choice.correct{background:var(--correct-bg);border-color:var(--correct);color:var(--correct);}
button.choice.wrong{background:var(--wrong-bg);border-color:var(--wrong);color:var(--wrong);}
.feedback{margin-top:16px;font-size:1rem;font-weight:700;min-height:1.4em;}
.feedback.ok{color:var(--correct);}
.feedback.no{color:var(--wrong);}
.explain{
  margin-top:8px;font-size:0.9rem;color:var(--sub);
  background:#faf9f6;border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;display:none;
}
.explain.show{display:block;}
.explain b{color:var(--ink);}
.next-wrap{margin-top:18px;text-align:right;}
.next-btn{
  background:var(--accent);color:#fff;border:none;
  padding:10px 24px;border-radius:999px;font-size:0.95rem;cursor:pointer;
  opacity:0;transform:translateY(4px);pointer-events:none;
  transition:opacity .2s ease, transform .2s ease;
  font-family:inherit;
}
.next-btn.show{opacity:1;transform:translateY(0);pointer-events:auto;}
.next-btn:hover{opacity:0.9;}
.result-card{text-align:center;padding:40px 22px;}
.result-score{font-size:3rem;font-weight:800;color:var(--accent);margin:10px 0 4px;}
.result-score span{font-size:1.3rem;color:var(--sub);font-weight:600;}
.result-msg{color:var(--sub);margin-bottom:22px;}
.missed{text-align:left;max-width:520px;margin:0 auto 24px;font-size:0.9rem;}
.missed h3{font-size:0.9rem;color:var(--sub);margin:0 0 6px;font-weight:600;}
.missed ul{margin:0;padding:0;list-style:none;border-top:1px solid var(--border);}
.missed li{padding:8px 4px;border-bottom:1px solid var(--border);}
.missed li b{color:var(--wrong);margin-right:6px;}
.result-actions{display:flex;flex-direction:column;gap:10px;align-items:center;}
.result-actions button{
  border:none;padding:12px 28px;border-radius:999px;
  font-size:0.95rem;cursor:pointer;min-width:240px;font-family:inherit;
}
.result-actions button:hover{opacity:0.9;}
.btn-primary{background:var(--accent);color:#fff;}
.btn-secondary{background:var(--accent-soft);color:var(--accent);}
footer{text-align:center;color:var(--sub);font-size:0.8rem;padding:30px 16px 10px;}
</style>
</head>
<body>

<div class="progress-wrap">
  <div class="progress-inner">
    <span id="progress-label">1問目 / 18問中</span>
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
    </div>
    <strong id="score-label">正解 0</strong>
  </div>
</div>

<header>
  <h1>ことわざクイズ（ことわざ①）</h1>
  <p id="instruction">ことわざの意味を選んでください。1問ずつ答え合わせをしながら進みます。</p>
</header>

<div class="mode-switch set-switch" id="set-switch">
  <button class="mode-btn active" data-set="1">ことわざ①</button>
  <button class="mode-btn" data-set="2">ことわざ②</button>
  <button class="mode-btn" data-set="all">全部</button>
</div>

<div class="mode-switch" id="mode-switch">
  <button class="mode-btn active" data-mode="term">ことわざ → 意味を選ぶ</button>
  <button class="mode-btn" data-mode="meaning">意味 → ことわざを選ぶ</button>
</div>

<main id="quiz"></main>

<footer id="footer">ことわざ① &middot; 全18問 &middot; ことわざの意味クイズ</footer>

<script>
/*
  データ形式
  term   : ことわざ
  kanji  : 読みがな
  emoji  : 画像がないときに表示する絵文字
  meaning: 意味
  mq     : 意味→ことわざモードで出す意味（答えがわかってしまう部分を伏せたもの。なければ meaning）
  画像を使う場合は images/01.png, images/02.jpg … のように問題番号で置いてください。
*/
const KOTO1 = [
  {"term": "青は藍より出でて藍より青し", "kanji": "あおはあいよりいでてあいよりあおし", "emoji": "🌿➡️💙", "meaning": "青色の染料は藍からとるが、それはもとの藍よりももっと青い。弟子が師よりもすぐれていることのたとえ。出藍の誉れ。", "mq": "青色の染料は藍からとるが、それはもとの藍よりももっと青い。弟子が師よりもすぐれていることのたとえ。"},
  {"term": "当たるも八卦、当たらぬも八卦", "kanji": "あたるもはっけ、あたらぬもはっけ", "emoji": "🔮🎯❓", "meaning": "占いは当たる場合もあれば、当たらない場合もあるということ。"},
  {"term": "危ない橋を渡る", "kanji": "あぶないはしをわたる", "emoji": "⚠️🌉🚶", "meaning": "危険な手段をとる。特に、法律に違反するような行為を承知で行うこと。"},
  {"term": "一刻千金", "kanji": "いっこくせんきん", "emoji": "⏰💰✨", "meaning": "わずかな時間が千金にも相当するということ。楽しい時、貴重な時が過ぎやすいのを惜しんでいう語。", "mq": "わずかな時間がとても大きな価値に相当するということ。楽しい時、貴重な時が過ぎやすいのを惜しんでいう語。"},
  {"term": "犬が西向きゃ尾は東", "kanji": "いぬがにしむきゃおはひがし", "emoji": "🐕⬅️🐾➡️", "meaning": "当然であること。また、それをことさらめいていう言葉。"},
  {"term": "犬に論語", "kanji": "いぬにろんご", "emoji": "🐕📖🤷", "meaning": "いくら道理を説いて聞かせても益がないこと。"},
  {"term": "いわしの頭も信心から", "kanji": "いわしのあたまもしんじんから", "emoji": "🐟🙏✨", "meaning": "イワシの頭のようなつまらないものでも信心する人には尊く思われる。物事をかたくなに信じる人をからかうときなどにもいう。", "mq": "つまらないものでも信心する人には尊く思われる。物事をかたくなに信じる人をからかうときなどにもいう。"},
  {"term": "嘘は泥棒の始まり", "kanji": "うそはどろぼうのはじまり", "emoji": "🤥➡️🦹", "meaning": "悪いと思わないで嘘をつく人は、泥棒をするのも平気になるということ。", "mq": "悪いと思わないで○○をつく人は、もっと悪いことをするのも平気になるということ。"},
  {"term": "鵜のまねをする烏", "kanji": "うのまねをするからす", "emoji": "🐦🐟💦❌", "meaning": "自分の能力をよく考えず、みだりに人まねをすると、必ず失敗するということのたとえ。"},
  {"term": "売り言葉に買い言葉", "kanji": "うりことばにかいことば", "emoji": "😠💬⚡💬😠", "meaning": "相手の暴言に応じて、同じような調子で言い返すこと。"},
  {"term": "鬼の居ぬ間に洗たく", "kanji": "おにのいぬまにせんたく", "emoji": "👹🚪😌🧺", "meaning": "怖い人や気兼ねする人のいない間に、思う存分くつろぐこと。"},
  {"term": "勝ってかぶとの緒をしめよ", "kanji": "かってかぶとのおをしめよ", "emoji": "🏆🪖💪", "meaning": "敵に勝っても油断しないで、心を引き締めよ、というたとえ。"},
  {"term": "九死に一生を得る", "kanji": "きゅうしにいっしょうをえる", "emoji": "😱➡️😮‍💨", "meaning": "ほとんど命が助かりそうもないところをかろうじて助かる。"},
  {"term": "清水の舞台から飛び降りる", "kanji": "きよみずのぶたいからとびおりる", "emoji": "🏯⬇️🪂", "meaning": "思い切って大きな決断を下すこと。"},
  {"term": "子はかすがい", "kanji": "こはかすがい", "emoji": "👨‍👩‍👧🔗", "meaning": "子供への愛情から夫婦の仲がなごやかになり、縁がつなぎ保たれることのたとえ。"},
  {"term": "歳月人を待たず", "kanji": "さいげつひとをまたず", "emoji": "📅⏳🏃", "meaning": "年月は人の都合にかかわりなく、刻々と過ぎていき、少しもとどまらない。"},
  {"term": "触らぬ神に祟りなし", "kanji": "さわらぬかみにたたりなし", "emoji": "⛩️🙅⚡", "meaning": "その物事にかかわりさえもたなければ、災いを招くことはない。めんどうなことによけいな手出しをするな、というたとえ。"},
  {"term": "柔よく剛を制す", "kanji": "じゅうよくごうをせいす", "emoji": "🌿🤸💪🪨", "meaning": "しなやかなものは、かたくて強いものの鋭い矛先を巧みにそらして、結局は勝利を得る。転じて、柔弱なものが、かえって剛強なものに勝つ。"}
];
const KOTO2 = [
  {"term": "背に腹はかえられぬ", "kanji": "せにはらはかえられぬ", "emoji": "😖⚖️🎒", "meaning": "さし迫った苦痛を回避するためには、ほかのことを犠牲にしてもしかたない。"},
  {"term": "前門の虎、後門の狼", "kanji": "ぜんもんのとら、こうもんのおおかみ", "emoji": "🐯🚪🐺", "meaning": "一つの災いを逃れても別の災いにあうたとえ。"},
  {"term": "宝の持ち腐れ", "kanji": "たからのもちぐされ", "emoji": "💎📦💤", "meaning": "1 役に立つ物を持ちながら、使わないでしまっておくこと。　2 才能・手腕がありながらそれを活用しないこと。"},
  {"term": "旅は道連れ世は情け", "kanji": "たびはみちづれよはなさけ", "emoji": "🧳🚶🚶🤝", "meaning": "旅では道連れのあることが心強く、同じように世を渡るには互いに情けをかけることが大切である。", "mq": "旅では仲間のいることが心強く、同じように世の中を生きるには互いに思いやりをかけることが大切である。"},
  {"term": "提灯に釣り鐘", "kanji": "ちょうちんにつりがね", "emoji": "🏮⚖️🔔", "meaning": "つりあいがとれないことのたとえ。"},
  {"term": "月夜に提灯", "kanji": "つきよにちょうちん", "emoji": "🌕🏮❓", "meaning": "不必要なこと、むだなことのたとえ。"},
  {"term": "鶴は千年亀は万年", "kanji": "つるはせんねんかめはまんねん", "emoji": "🐦🐢🎉", "meaning": "長寿で、めでたいことのたとえ。"},
  {"term": "十日の菊、六日の菖蒲", "kanji": "とおかのきく、むいかのあやめ", "emoji": "🌼📅⌛", "meaning": "時機に後れて役に立たない物事のたとえ。"},
  {"term": "生兵法は大怪我のもと", "kanji": "なまびょうほうはおおけがのもと", "emoji": "📕🤺🤕", "meaning": "少しばかりの知識や技術に頼ったり自負したりすると、かえって大失敗をすることのたとえ。"},
  {"term": "逃がした魚は大きい", "kanji": "にがしたさかなはおおきい", "emoji": "🎣🐟💭🐋", "meaning": "手に入れそこなったものは、惜しさが加わって、実際より価値があるように思われるものである。"},
  {"term": "憎まれっ子世にはばかる", "kanji": "にくまれっこよにはばかる", "emoji": "😈👑", "meaning": "人に憎まれるような者が、かえって世間では幅をきかせる。"},
  {"term": "残り物には福がある", "kanji": "のこりものにはふくがある", "emoji": "🍰🍀", "meaning": "人が取り残したものや最後に残ったものの中には、意外によいものがある。"},
  {"term": "人を呪わば穴二つ", "kanji": "ひとをのろわばあなふたつ", "emoji": "👿🕳️🕳️", "meaning": "他人を呪って殺そうとすれば、自分もその報いで殺されることになるので、墓穴が二つ必要になる。"},
  {"term": "へそで茶を沸かす", "kanji": "へそでちゃをわかす", "emoji": "😂🫖", "meaning": "おかしくてたまらないこと。また、ばかばかしくてしようがないこと。笑止千万である。"},
  {"term": "坊主憎けりゃ袈裟まで憎い", "kanji": "ぼうずにくけりゃけさまでにくい", "emoji": "👨‍🦲👘😡", "meaning": "その人を憎むあまり、その人に関係のあるものすべてが憎くなるというたとえ。"},
  {"term": "目は口ほどに物を言う", "kanji": "めはくちほどにものをいう", "emoji": "👀💬", "meaning": "情のこもった目つきは、口で話すのと同じくらい気持ちを表現する。"},
  {"term": "三日見ぬ間の桜", "kanji": "みっかみぬまのさくら", "emoji": "🌸➡️🍃", "meaning": "世の中の移り変わりが激しいことのたとえ。"},
  {"term": "餅は餅屋", "kanji": "もちはもちや", "emoji": "🍡👨‍🍳", "meaning": "餅は餅屋のついたものがいちばんうまい。その道のことはやはり専門家が一番であるというたとえ。", "mq": "その道のことはやはり専門家が一番であるというたとえ。"},
  {"term": "やぶから棒", "kanji": "やぶからぼう", "emoji": "🌳🪵💥", "meaning": "突然に物事を行うさま。だしぬけ。唐突。"},
  {"term": "笑う門には福来る", "kanji": "わらうかどにはふくきたる", "emoji": "😄🏠🍀", "meaning": "笑いの絶えない人の家には、自然と幸福が訪れる。"}
];

const QUESTIONS = [
  ...KOTO1.map(q => ({ ...q, set:1 })),
  ...KOTO2.map(q => ({ ...q, set:2 }))
];
const SETS = {
  "1":   { name:"ことわざ①", filter:q => q.set === 1 },
  "2":   { name:"ことわざ②", filter:q => q.set === 2 },
  "all": { name:"ことわざ①②", filter:() => true }
};

/* 複数の意味があることわざに「◯つ目の意味」の番号をつける */
QUESTIONS.forEach((q, i) => {
  const same = QUESTIONS.filter(x => x.term === q.term);
  q.senseTotal = same.length;
  q.senseNo = same.indexOf(q) + 1;
});
function senseLabel(q){
  return q.senseTotal > 1 ? `<span class="q-sense">${q.senseNo}つ目の意味</span>` : "";
}

/* 意味が似ていてまぎらわしい組み合わせ（選択肢に同時に出さない） */
const CONFLICTS = {
  "一刻千金": ["歳月人を待たず"],
  "歳月人を待たず": ["一刻千金"],
  "危ない橋を渡る": ["清水の舞台から飛び降りる"],
  "清水の舞台から飛び降りる": ["危ない橋を渡る"],
  "十日の菊、六日の菖蒲": ["月夜に提灯"],
  "月夜に提灯": ["十日の菊、六日の菖蒲"],
  "鵜のまねをする烏": ["生兵法は大怪我のもと"],
  "生兵法は大怪我のもと": ["鵜のまねをする烏"],
  "人を呪わば穴二つ": ["坊主憎けりゃ袈裟まで憎い"],
  "坊主憎けりゃ袈裟まで憎い": ["人を呪わば穴二つ","憎まれっ子世にはばかる"],
  "憎まれっ子世にはばかる": ["坊主憎けりゃ袈裟まで憎い"]
};

const LABELS = ["ア","イ","ウ","エ"];
const INSTRUCTIONS = {
  term: "ことわざの意味を選んでください。1問ずつ答え合わせをしながら進みます。",
  meaning: "意味に合うことわざを選んでください。1問ずつ答え合わせをしながら進みます。"
};

const quizEl = document.getElementById("quiz");
const progressLabel = document.getElementById("progress-label");
const progressFill = document.getElementById("progress-fill");
const scoreLabel = document.getElementById("score-label");
const instructionEl = document.getElementById("instruction");
const modeSwitchEl = document.getElementById("mode-switch");

const setSwitchEl = document.getElementById("set-switch");
const titleEl = document.querySelector("header h1");
let currentSet = "1";
let allIndices = [];
let mode = "term";
let activeIndices = [];
let current = 0;
let score = 0;
let wrongIndices = [];

function applySet(){
  allIndices = QUESTIONS.map((_, i) => i).filter(i => SETS[currentSet].filter(QUESTIONS[i]));
  titleEl.textContent = `ことわざクイズ（${SETS[currentSet].name}）`;
  document.getElementById("footer").innerHTML = `${SETS[currentSet].name} &middot; 全${allIndices.length}問 &middot; ことわざの意味クイズ`;
}
applySet();
activeIndices = shuffle(allIndices);

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function exampleHTML(q, blank){
  if (!q.example) return "";
  return "「" + q.example.replace(/\[(.+?)\]/g, (_, w) =>
    blank ? `<span class="blank">？</span>` : `<mark>${w}</mark>`) + "」";
}

function isConflict(a, b){
  return (CONFLICTS[a] || []).includes(b);
}

function resetRun(indices){
  activeIndices = shuffle(indices);
  current = 0;
  score = 0;
  wrongIndices = [];
  renderQuestion();
}

setSwitchEl.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.set === currentSet) return;
    currentSet = btn.dataset.set;
    setSwitchEl.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
    applySet();
    resetRun(allIndices);
  });
});

modeSwitchEl.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.mode === mode) return;
    mode = btn.dataset.mode;
    modeSwitchEl.querySelectorAll(".mode-btn").forEach(b => b.classList.toggle("active", b === btn));
    instructionEl.textContent = INSTRUCTIONS[mode];
    resetRun(allIndices);
  });
});

function updateProgress(){
  const total = activeIndices.length;
  const shown = Math.min(current + 1, total);
  progressLabel.textContent = current < total ? `${shown}問目 / ${total}問中` : `終了 / ${total}問中`;
  progressFill.style.width = (current / total * 100) + "%";
  scoreLabel.textContent = `正解 ${score}`;
}

/* ことわざ→意味：正しい意味＋同じ語の別の意味（最大2つ）＋他の語の意味 */
function buildMeaningOptions(idx){
  const q = QUESTIONS[idx];
  const siblings = shuffle(allIndices.filter(i => i !== idx && QUESTIONS[i].term === q.term)).slice(0, 2);
  const others = shuffle(allIndices.filter(i =>
    QUESTIONS[i].term !== q.term && !isConflict(q.term, QUESTIONS[i].term)
  ));
  const picked = [...siblings];
  const usedTerms = new Set();
  for (const i of others) {
    if (picked.length >= 3) break;
    const t = QUESTIONS[i].term;
    if (usedTerms.has(t)) continue;
    if ([...usedTerms].some(u => isConflict(u, t))) continue;
    usedTerms.add(t);
    picked.push(i);
  }
  return shuffle([idx, ...picked]).map(i => ({ text: QUESTIONS[i].mq || QUESTIONS[i].meaning, correct: i === idx }));
}

/* 意味→ことわざ：正しいことわざ＋ほかのことわざ3つ（まぎらわしいものは除く） */
function buildTermOptions(idx){
  const q = QUESTIONS[idx];
  const terms = [...new Set(allIndices.map(i => QUESTIONS[i].term))];
  const pool = shuffle(terms.filter(t => t !== q.term && !isConflict(q.term, t)));
  const picked = [];
  for (const t of pool) {
    if (picked.length >= 3) break;
    if (picked.some(p => isConflict(p, t))) continue;
    picked.push(t);
  }
  return shuffle([q.term, ...picked]).map(t => ({ text: t, correct: t === q.term }));
}

function renderQuestion(){
  updateProgress();
  const idx = activeIndices[current];
  const q = QUESTIONS[idx];
  quizEl.innerHTML = "";

  const card = document.createElement("div");
  card.className = "card";
  const body = document.createElement("div");
  body.className = "q-body";

  // 画像（images/01.png など）→ なければ絵文字
  const imageWrap = document.createElement("div");
  imageWrap.className = "q-image-wrap";
  const img = document.createElement("img");
  img.className = "q-image";
  img.alt = q.term + "のイラスト";
  const fallback = document.createElement("div");
  fallback.className = "q-image-fallback";
  fallback.textContent = q.emoji;
  const num = String(idx + 1).padStart(2, "0");
  const exts = ["png", "jpg", "jpeg", "webp"];
  let extAttempt = 0;
  function tryLoadImage(){
    if (extAttempt >= exts.length) {
      img.style.display = "none";
      fallback.style.display = "flex";
      return;
    }
    img.src = `images/${num}.${exts[extAttempt]}`;
    extAttempt++;
  }
  img.addEventListener("error", tryLoadImage);
  tryLoadImage();
  imageWrap.appendChild(img);
  imageWrap.appendChild(fallback);
  body.appendChild(imageWrap);

  const content = document.createElement("div");
  content.className = "q-content";

  const head = document.createElement("div");
  head.className = "q-head";
  if (mode === "term") {
    head.innerHTML = `
      <span class="q-num">第${allIndices.indexOf(idx) + 1}問</span>
      <span class="q-term">${q.term}</span>
      <span class="q-emoji">${q.emoji}</span>
      ${q.kanji ? `<span class="q-reading">（${q.kanji}）</span>` : ""}
      ${senseLabel(q)}
    `;
  } else {
    head.innerHTML = `
      <span class="q-num">第${allIndices.indexOf(idx) + 1}問</span>
      <span class="q-emoji">${q.emoji}</span>
      ${senseLabel(q)}
    `;
  }
  content.appendChild(head);

  if (mode === "meaning") {
    const meaningPrompt = document.createElement("div");
    meaningPrompt.className = "q-meaning-prompt";
    meaningPrompt.textContent = q.mq || q.meaning;
    content.appendChild(meaningPrompt);
  }

  const ex = document.createElement("div");
  ex.className = "q-example";
  ex.innerHTML = `<span class="ex-label">用例</span>${exampleHTML(q, mode === "meaning")}`;
  if (q.example) content.appendChild(ex);

  const choicesWrap = document.createElement("div");
  choicesWrap.className = "choices";
  const feedback = document.createElement("div");
  feedback.className = "feedback";
  const explain = document.createElement("div");
  explain.className = "explain";
  explain.innerHTML = `${q.emoji} <b>${q.term}</b>${q.kanji ? `（${q.kanji}）` : ""}${q.senseTotal > 1 ? `［${q.senseNo}つ目の意味］` : ""}：${q.meaning}${q.example ? "<br>" + exampleHTML(q, false) : ""}`;

  const nextWrap = document.createElement("div");
  nextWrap.className = "next-wrap";
  const nextBtn = document.createElement("button");
  nextBtn.className = "next-btn";
  nextBtn.textContent = current === activeIndices.length - 1 ? "結果を見る" : "次の問題へ";
  nextBtn.addEventListener("click", () => {
    current++;
    if (current < activeIndices.length) renderQuestion();
    else renderResult();
  });
  nextWrap.appendChild(nextBtn);

  const optionsData = mode === "term" ? buildMeaningOptions(idx) : buildTermOptions(idx);
  const correctPosition = optionsData.findIndex(o => o.correct);

  optionsData.forEach((opt, ci) => {
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = `<span class="label">${LABELS[ci]}</span>${opt.text}`;
    btn.addEventListener("click", () => {
      if (btn.dataset.locked) return;
      const buttons = choicesWrap.querySelectorAll("button.choice");
      buttons.forEach(b => b.dataset.locked = "1");
      if (ci === correctPosition) {
        btn.classList.add("correct");
        feedback.textContent = "○ 正解！";
        feedback.className = "feedback ok";
        score++;
      } else {
        btn.classList.add("wrong");
        buttons[correctPosition].classList.add("correct");
        feedback.textContent = "× 不正解";
        feedback.className = "feedback no";
        wrongIndices.push(idx);
      }
      if (mode === "meaning" && q.example) ex.innerHTML = `<span class="ex-label">用例</span>${exampleHTML(q, false)}`;
      explain.classList.add("show");
      scoreLabel.textContent = `正解 ${score}`;
      nextBtn.classList.add("show");
    });
    choicesWrap.appendChild(btn);
  });

  content.appendChild(choicesWrap);
  content.appendChild(feedback);
  content.appendChild(explain);
  content.appendChild(nextWrap);
  body.appendChild(content);
  card.appendChild(body);
  quizEl.appendChild(card);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

function renderResult(){
  const total = activeIndices.length;
  progressLabel.textContent = `終了 / ${total}問中`;
  progressFill.style.width = "100%";
  scoreLabel.textContent = `正解 ${score}`;

  quizEl.innerHTML = "";
  const card = document.createElement("div");
  card.className = "card result-card";

  const pct = Math.round(score / total * 100);
  let msg = "";
  if (pct === 100) msg = "全問正解です！すばらしい！";
  else if (pct >= 80) msg = "よくできました！";
  else if (pct >= 50) msg = "もう少し復習してみましょう。";
  else msg = "もう一度見直してみましょう。";

  card.innerHTML = `
    <div>結果</div>
    <div class="result-score">${score}<span> / ${total}</span></div>
    <div class="result-msg">${msg}</div>
  `;

  const missedThisRun = wrongIndices.slice();

  if (missedThisRun.length > 0) {
    const missed = document.createElement("div");
    missed.className = "missed";
    missed.innerHTML = `<h3>まちがえたことわざ</h3><ul>${
      missedThisRun.map(i => {
        const q = QUESTIONS[i];
        return `<li>${q.emoji} <b>${q.term}</b>（${q.kanji}）<br>${q.senseTotal > 1 ? `［${q.senseNo}つ目の意味］` : ""}${q.meaning}</li>`;
      }).join("")
    }</ul>`;
    card.appendChild(missed);
  }

  const actions = document.createElement("div");
  actions.className = "result-actions";

  if (missedThisRun.length > 0) {
    const retryWrongBtn = document.createElement("button");
    retryWrongBtn.className = "btn-primary";
    retryWrongBtn.textContent = `間違えた問題だけやり直す（${missedThisRun.length}問）`;
    retryWrongBtn.addEventListener("click", () => resetRun(missedThisRun));
    actions.appendChild(retryWrongBtn);
  }

  const retrySameBtn = document.createElement("button");
  retrySameBtn.className = missedThisRun.length > 0 ? "btn-secondary" : "btn-primary";
  retrySameBtn.textContent = "同じ問題でもう一度";
  retrySameBtn.addEventListener("click", () => resetRun(activeIndices));
  actions.appendChild(retrySameBtn);

  if (activeIndices.length !== allIndices.length) {
    const allBtn = document.createElement("button");
    allBtn.className = "btn-secondary";
    allBtn.textContent = `全${allIndices.length}問に戻る`;
    allBtn.addEventListener("click", () => resetRun(allIndices));
    actions.appendChild(allBtn);
  }

  card.appendChild(actions);
  quizEl.appendChild(card);
}

renderQuestion();
</script>
</body>
</html>
